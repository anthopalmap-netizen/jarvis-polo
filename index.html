<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#070b14">
<style>
  :root { --fond:#070b14; --panneau:#0f1726; --cyan:#3be3ff; --or:#ffb627; --rouge:#c8102e; --texte:#e6f4ff; --gris:#7f93ad; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 0%, #12233d 0%, var(--fond) 60%); color:var(--texte); font-family:"Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid #1d2b42; }
  .reacteur { width:46px; height:46px; border-radius:50%; background:radial-gradient(circle, #fff 0 18%, var(--cyan) 30%, #0b5d73 60%, transparent 70%); box-shadow:0 0 18px var(--cyan); animation:pulse 2.4s infinite; flex-shrink:0; }
  .reacteur.reflechit { animation:pulse .5s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 34px var(--cyan); transform:scale(1.06); } }
  h1 { margin:0; font-size:1.4rem; letter-spacing:.3em; color:var(--cyan); }
  .sous { font-size:.8rem; color:var(--gris); }
  .boutons-haut { margin-left:auto; display:flex; gap:8px; }
  .petit { background:transparent; border:1px solid #2a3c58; color:var(--texte); border-radius:10px; padding:8px 10px; cursor:pointer; font-size:1rem; }
  .petit.actif { border-color:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  #fil { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:85%; padding:12px 15px; border-radius:16px; line-height:1.45; white-space:pre-wrap; font-size:1.05rem; }
  .jarvis { align-self:flex-start; background:var(--panneau); border:1px solid #1f3a55; border-bottom-left-radius:4px; }
  .polo { align-self:flex-end; background:linear-gradient(135deg, var(--rouge), #8a0b20); border-bottom-right-radius:4px; }
  .raccourcis { display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 8px; max-width:820px; width:100%; margin:0 auto; }
  .raccourcis button { background:#111c2e; border:1px solid #2a3c58; color:var(--texte); border-radius:20px; padding:7px 12px; cursor:pointer; font-size:.9rem; }
  .raccourcis button:hover { border-color:var(--or); }
  form { display:flex; gap:8px; padding:12px 18px 18px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; background:#0c1424; border:1px solid #2a3c58; color:var(--texte); border-radius:14px; padding:14px; font-size:1.05rem; outline:none; }
  input:focus { border-color:var(--cyan); }
  .rond { width:52px; border-radius:14px; border:none; font-size:1.3rem; cursor:pointer; }
  #micro { background:#1b2940; color:#fff; }
  #micro.ecoute { background:var(--rouge); animation:pulse 1s infinite; }
  #envoyer { background:var(--or); color:#1a1200; font-weight:700; }
  #reglages { position:fixed; inset:0; background:rgba(3,6,12,.92); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #reglages.ouvert { display:flex; }
  .carte { background:var(--panneau); border:1px solid #1f3a55; border-radius:16px; padding:20px; width:100%; max-width:440px; }
  .carte h2 { margin:0 0 6px; color:var(--cyan); font-size:1.1rem; }
  .carte p { color:var(--gris); font-size:.9rem; margin:6px 0 14px; }
  .carte label { display:block; font-size:.85rem; margin:10px 0 4px; }
  .carte input, .carte select { width:100%; background:#0c1424; border:1px solid #2a3c58; color:var(--texte); border-radius:10px; padding:12px; font-size:1rem; }
  .carte .actions { display:flex; gap:8px; margin-top:16px; }
  .carte .actions button { flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; cursor:pointer; }
  .ok { background:var(--or); color:#1a1200; } .annuler { background:#1b2940; color:#fff; }
  @media (max-width:480px) { h1 { font-size:1.1rem; } .sous { display:none; } .msg { max-width:92%; } }
</style>
</head>
<body>
<header>
  <div class="reacteur" id="reacteur"></div>
  <div><h1>JARVIS</h1><div class="sous">Assistant personnel de Monsieur Polo</div></div>
  <div class="boutons-haut">
    <button class="petit" id="voix" title="Jarvis parle à voix haute">🔊</button>
    <button class="petit" id="btn-reglages" title="Réglages (papa)">⚙️</button>
    <button class="petit" id="nouveau" title="Nouvelle conversation">🔄</button>
  </div>
</header>

<div id="fil"></div>

<div class="raccourcis">
  <button data-t="Jarvis, qu'est-ce que je dois mettre dans mon sac de foot ?">⚽ Sac de foot</button>
  <button data-t="Jarvis, aide-moi à vérifier mon cartable pour demain.">🎒 Cartable</button>
  <button data-t="Jarvis, donne-moi un conseil de défenseur !">🛡️ Conseil foot</button>
  <button data-t="Jarvis, on crée un jeu vidéo ?">🎮 Jeu vidéo</button>
  <button data-t="Jarvis, qu'est-ce que je peux faire au potager ?">🌱 Potager</button>
</div>

<form id="formulaire">
  <button type="button" class="rond" id="micro" title="Parler à Jarvis">🎤</button>
  <input id="saisie" placeholder="Parle à Jarvis…" autocomplete="off">
  <button class="rond" id="envoyer" title="Envoyer">➤</button>
</form>

<div id="reglages"><div class="carte">
  <h2>⚙️ Réglages de Jarvis</h2>
  <p>Réservé à papa. La clé reste uniquement sur ce téléphone.</p>
  <label for="cle">Clé API Anthropic (commence par sk-ant-)</label>
  <input id="cle" type="password" autocomplete="off" placeholder="sk-ant-...">
  <label for="modele">Cerveau</label>
  <select id="modele">
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (très bon)</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (rapide, moins cher)</option>
  </select>
  <div class="actions"><button class="annuler" id="annuler">Annuler</button><button class="ok" id="valider">Enregistrer</button></div>
</div></div>

<script>
const CERVEAU = "# Cerveau de JARVIS – Assistant personnel de Polo\n\nTu es JARVIS, l'assistant personnel de Polo, un garçon de presque 10 ans.\nTu t'inspires du Jarvis d'Iron Man : intelligent, serviable et toujours prêt à aider.\n\n## Ta personnalité\n- Tu es drôle et blagueur, mais toujours poli. Tu appelles Polo « Monsieur Polo » de temps en temps, avec humour.\n- Tu glisses des références aux super-héros, au foot et à la technologie.\n- Tu encourages Polo, tu le félicites quand il réussit, et tu restes patient quand il se trompe.\n- Tu parles simplement, avec des phrases courtes, comme à un enfant de 10 ans.\n- Tes réponses sont courtes : 3 à 5 phrases en général, sauf si Polo demande plus de détails.\n\n## Ce que tu sais de Polo\n- Il joue au foot en **défense**.\n- Il a **entraînement le mardi et le vendredi**.\n- À l'école, il a **maths et français tous les jours**, et **sport le mercredi**.\n- Il n'a **jamais créé de jeu vidéo** et veut commencer de zéro.\n- Il veut **créer un potager en pleine terre**.\n\n## Mission 1 – Le sac de foot\nLa veille et le jour d'un entraînement (lundi soir, mardi, jeudi soir, vendredi), rappelle à Polo de préparer son sac.\nListe type : crampons, protège-tibias, chaussettes de foot, short, maillot, gourde d'eau, serviette, vêtements de rechange, K-way s'il pleut, bonnet et gants quand il fait froid.\nFais-le de façon amusante, par exemple sous forme de « check-list de mission ».\n\n## Mission 2 – Le cartable\nAide Polo à vérifier son cartable pour le lendemain :\n- Tous les jours : affaires de maths, affaires de français, trousse complète, agenda, devoirs faits.\n- Le mercredi : en plus, la tenue de sport (baskets, jogging, t-shirt).\nPose-lui les questions une par une, comme un contrôle avant décollage.\n\n## Mission 3 – Coach de foot (spécial défenseur)\nDonne des conseils adaptés à un enfant de 10 ans : placement, marquage, tacle sans faute, communication avec les coéquipiers, jeu de tête prudent, relance propre.\nPropose des petits exercices à faire seul dans le jardin.\nRappelle l'importance de l'échauffement, de boire de l'eau et du fair-play.\n\n## Mission 4 – Prof de jeux vidéo\nPolo commence de zéro. Commence avec **Scratch** (gratuit, sur scratch.mit.edu).\n- Avance étape par étape, une seule étape à la fois, et attends que Polo dise qu'il a réussi.\n- Propose des premiers projets simples et amusants, par exemple un jeu où un défenseur doit arrêter des ballons.\n- Ne fais pas le travail à sa place : guide-le avec des indices pour qu'il trouve lui-même.\n- Plus tard, s'il est à l'aise, propose de passer au langage Python.\n\n## Mission 5 – Expert du potager\nAide Polo à créer son potager en pleine terre depuis le début : choisir l'endroit (soleil), préparer la terre, choisir des légumes faciles (radis, salades, tomates cerises, haricots, fraises, courgettes), planter selon la saison, arroser, récolter.\nTiens compte de la saison actuelle (Polo vit en France).\nPropose des petites missions jardinage de la semaine.\n\n## Règles de sécurité (très importantes)\n- Pour tout ce qui est dangereux (outils coupants, bêcher, produits de jardin, ordinateur, Internet, cuisine), dis à Polo de demander l'aide d'un adulte.\n- Ne demande jamais d'informations personnelles (adresse, nom de famille, école, mots de passe) et rappelle à Polo de ne jamais les donner sur Internet.\n- Si Polo parle de quelque chose qui le rend triste, qui lui fait peur ou d'un problème grave, réponds avec gentillesse et encourage-le à en parler à ses parents ou à un adulte de confiance.\n- Reste toujours adapté à son âge : pas de contenu violent, effrayant ou pour les grands.\n- Si tu ne sais pas quelque chose, dis-le honnêtement au lieu d'inventer.\n\n## Quand Polo te dit bonjour\nPrésente-toi avec humour, rappelle-lui en une phrase ce que tu peux faire pour lui, et demande-lui ce qu'il veut faire aujourd'hui.\n";
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function lireReglage(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function ecrireReglage(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function cerveauDuJour() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,"0") + "h" + String(n.getMinutes()).padStart(2,"0");
  return CERVEAU + "\n\n## Maintenant\nNous sommes le " + JOURS[n.getDay()] + " " + n.getDate() + " " + MOIS[n.getMonth()] + " " + n.getFullYear() + ", il est " + h + ".\n";
}
async function demanderAClaude(msgs) {
  const cle = lireReglage("jarvis_cle", "");
  if (!cle.startsWith("sk-ant-")) return "Oups, Monsieur Polo ! Mon réacteur n'a pas de clé. Demande à papa de toucher la roue ⚙️ en haut.";
  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": cle, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: lireReglage("jarvis_modele", "claude-sonnet-5-5"), max_tokens: 800, system: cerveauDuJour(), messages: msgs.slice(-40) })
    });
  } catch (e) { return "Je n'arrive pas à me connecter à Internet. Vérifie le Wi-Fi et réessaie !"; }
  if (r.status === 401) return "Ma clé ne fonctionne pas. Papa doit la vérifier dans les réglages ⚙️.";
  if (!r.ok) {
    const t = await r.text();
    if (r.status === 429 || /credit|billing/i.test(t)) return "Mes batteries sont à plat (crédit ou limite atteinte). Papa doit vérifier le compte Anthropic.";
    return "Petit bug dans mes circuits (erreur " + r.status + "). Réessaie dans un instant !";
  }
  const d = await r.json();
  return (d.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}

const fil = document.getElementById("fil");
const saisie = document.getElementById("saisie");
const reacteur = document.getElementById("reacteur");
let messages = [];
let voixActive = false;

function charger() {
  try { messages = JSON.parse(localStorage.getItem("jarvis_messages") || "[]"); } catch (e) { messages = []; }
  try { voixActive = localStorage.getItem("jarvis_voix") === "1"; } catch (e) {}
  document.getElementById("voix").classList.toggle("actif", voixActive);
}
function sauver() {
  try { localStorage.setItem("jarvis_messages", JSON.stringify(messages.slice(-60))); } catch (e) {}
}
function afficher(role, texte) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "polo" : "jarvis");
  d.textContent = texte;
  fil.appendChild(d);
  fil.scrollTop = fil.scrollHeight;
}
function parler(texte) {
  if (!voixActive || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const propre = texte.replace(/[\u{1F300}-\u{1FAFF}☀-➿*#_]/gu, "");
  const u = new SpeechSynthesisUtterance(propre);
  u.lang = "fr-FR";
  const voixFr = speechSynthesis.getVoices().filter(v => v.lang.startsWith("fr"));
  const homme = voixFr.find(v => /thomas|paul|henri|male|homme/i.test(v.name));
  if (homme || voixFr[0]) u.voice = homme || voixFr[0];
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

async function envoyer(texte) {
  texte = texte.trim();
  if (!texte) return;
  messages.push({ role: "user", content: texte });
  afficher("user", texte);
  saisie.value = "";
  reacteur.classList.add("reflechit");
  const reponse = await demanderAClaude(messages);
  messages.push({ role: "assistant", content: reponse });
  afficher("assistant", reponse);
  parler(reponse);
  reacteur.classList.remove("reflechit");
  sauver();
}

document.getElementById("formulaire").addEventListener("submit", e => { e.preventDefault(); envoyer(saisie.value); });
document.querySelectorAll(".raccourcis button").forEach(b => b.addEventListener("click", () => envoyer(b.dataset.t)));
document.getElementById("voix").addEventListener("click", e => {
  voixActive = !voixActive;
  e.currentTarget.classList.toggle("actif", voixActive);
  try { localStorage.setItem("jarvis_voix", voixActive ? "1" : "0"); } catch (err) {}
  if (!voixActive && window.speechSynthesis) speechSynthesis.cancel();
});
document.getElementById("nouveau").addEventListener("click", () => {
  if (!confirm("Effacer la conversation et recommencer ?")) return;
  messages = []; sauver(); fil.innerHTML = ""; envoyer("Jarvis, activation !");
});

// Micro : reconnaissance vocale du navigateur (Chrome ou Edge)
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
const boutonMicro = document.getElementById("micro");
if (Reco) {
  const reco = new Reco();
  reco.lang = "fr-FR";
  reco.interimResults = false;
  reco.onresult = e => envoyer(e.results[0][0].transcript);
  reco.onend = () => boutonMicro.classList.remove("ecoute");
  boutonMicro.addEventListener("click", () => {
    if (window.speechSynthesis) speechSynthesis.cancel();
    boutonMicro.classList.add("ecoute");
    reco.start();
  });
} else {
  boutonMicro.title = "Le micro marche avec Chrome ou Edge";
  boutonMicro.addEventListener("click", () => alert("Pour parler à Jarvis avec le micro, ouvre-le dans Chrome ou Edge."));
}

const panneau = document.getElementById("reglages");
document.getElementById("btn-reglages").addEventListener("click", () => {
  document.getElementById("cle").value = lireReglage("jarvis_cle", "");
  document.getElementById("modele").value = lireReglage("jarvis_modele", "claude-sonnet-5-5");
  panneau.classList.add("ouvert");
});
document.getElementById("annuler").addEventListener("click", () => panneau.classList.remove("ouvert"));
document.getElementById("valider").addEventListener("click", () => {
  ecrireReglage("jarvis_cle", document.getElementById("cle").value.trim());
  ecrireReglage("jarvis_modele", document.getElementById("modele").value);
  panneau.classList.remove("ouvert");
  if (!messages.length) envoyer("Jarvis, activation !");
});

charger();
if (!lireReglage("jarvis_cle", "")) document.getElementById("btn-reglages").click();
else if (messages.length) messages.forEach(m => afficher(m.role, m.content));
else envoyer("Jarvis, activation !");
</script>
</body>
</html>
